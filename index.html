<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Conteo de Cartas</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fca5a5;
            --accent: #f59e0b;
            --accent-light: #fef3c7;
            --info: #0284c7;
            --info-light: #e0f2fe;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 14px -2px rgba(79, 70, 229, 0.08), 0 2px 6px -1px rgba(0,0,0,0.04);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --surface: #1e293b;
                --surface-subtle: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --primary-light: rgba(79, 70, 229, 0.2);
                --info-light: rgba(2, 132, 199, 0.2);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: clamp(8px, 2vw, 20px);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            background: var(--surface);
            padding: clamp(10px, 2vw, 16px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #f59e0b);
        }

        .header-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .lang-select {
            padding: 4px 8px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--surface-subtle);
            color: var(--text-main);
            cursor: pointer;
            width: auto;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-icon-svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(1.15rem, 2.5vw, 1.45rem);
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 768px) {
            .game-dashboard-layout {
                grid-template-columns: 1.8fr 1.2fr;
                align-items: start;
            }
        }

        .card {
            background: var(--surface);
            padding: clamp(12px, 2vw, 18px);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .card h2 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 9px 11px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            background: var(--surface-subtle);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        button {
            padding: 9px 13px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--primary);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.2);
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.danger {
            background: var(--danger);
            box-shadow: 0 2px 5px rgba(239, 68, 68, 0.2);
        }

        button.warning {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 2px 5px rgba(245, 158, 11, 0.2);
        }

        button.full-width {
            width: 100%;
            padding: 11px;
            font-size: 0.92rem;
        }

        .players-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .player-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .player-card.leader {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--surface) 0%, var(--accent-light) 300%);
        }

        .player-card.eliminated {
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .badge-container {
            display: flex;
            gap: 4px;
            position: absolute;
            top: -8px;
            right: 10px;
        }

        .leader-badge {
            background: var(--accent);
            color: #0f172a;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .elim-badge {
            background: var(--danger);
            color: white;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .player-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .player-identity {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.88rem;
            border: 1.5px solid var(--primary);
        }

        .player-card.eliminated .player-avatar {
            background: #fee2e2;
            color: var(--danger);
            border-color: var(--danger);
        }

        .player-name-wrapper {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .player-name {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reentry-pill {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--info);
            background: var(--info-light);
            padding: 1px 5px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            width: fit-content;
            margin-top: 1px;
        }

        .player-score-badge {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            white-space: nowrap;
        }

        .player-card.eliminated .player-score-badge {
            color: var(--danger);
            text-decoration: line-through;
        }

        .player-actions-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .score-input-large {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            background: var(--surface-subtle);
            color: var(--text-main);
        }

        .score-input-large:focus {
            background: var(--surface);
            border-color: var(--primary);
        }

        .btn-add-pts {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.88rem;
        }

        .delete-player-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 4px 6px;
            box-shadow: none;
        }

        .delete-player-btn:hover {
            color: var(--danger);
        }

        ul.player-setup-list {
            list-style: none;
            margin-top: 8px;
        }

        ul.player-setup-list li {
            background: var(--surface-subtle);
            padding: 7px 10px;
            border-radius: var(--radius-md);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .hidden {
            display: none !important;
        }

        .status-banner {
            text-align: center;
            padding: 9px 12px;
            background: var(--primary-light);
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .msg-box {
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 6px;
            display: none;
        }

        .msg-box.error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger-border);
            display: block;
        }

        .action-buttons-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .action-buttons-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <select id="lang-switch" class="lang-select">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
            </select>
        </div>
        <div class="brand-wrapper">
            <svg class="brand-icon-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="14" width="32" height="44" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="3" transform="rotate(-10 22 36)"/>
                <path d="M 18 24 L 22 28 L 18 32 L 14 28 Z" fill="#ef4444" transform="rotate(-10 22 36)"/>
                <rect x="26" y="10" width="32" height="44" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="3" transform="rotate(8 42 32)"/>
                <path d="M 42 22 C 40 18, 34 20, 36 25 C 38 30, 42 32, 42 32 C 42 32, 46 30, 48 25 C 50 20, 44 18, 42 22 Z" fill="#ef4444" transform="rotate(8 42 32)"/>
            </svg>
            <h1 id="app-title">Conteo de Cartas</h1>
        </div>
    </header>

    <!-- PANTALLA 1: CONFIGURACIÓN -->
    <div id="setup-screen">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h2 id="setup-title">⚙️ Configuración de la Partida</h2>
            
            <div class="grid-2-col">
                <div class="form-group">
                    <label for="limit-input" id="lbl-limit">Límite de Puntos</label>
                    <input type="number" id="limit-input" placeholder="Ej: 100" value="100">
                </div>
                <div class="form-group">
                    <label for="max-reentries-input" id="lbl-max-reentries">Máx. Reenganches</label>
                    <input type="number" id="max-reentries-input" placeholder="0 = Ilimitado" value="0" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="player-name-input" id="lbl-add-players">Añadir Jugadores</label>
                <div class="input-group">
                    <input type="text" id="player-name-input" placeholder="Nombre del jugador">
                    <button type="button" id="btn-add-initial">+ Añadir</button>
                </div>
                <div id="setup-msg" class="msg-box"></div>
            </div>

            <ul id="initial-players-list" class="player-setup-list"></ul>

            <button type="button" id="btn-start-game" class="full-width" style="margin-top: 12px;">🚀 ¡Iniciar Partida!</button>
        </div>
    </div>

    <!-- PANTALLA 2: TABLERO DE JUEGO -->
    <div id="game-screen" class="hidden">
        <div class="status-banner" id="limit-display"></div>

        <div class="game-dashboard-layout">
            <div>
                <div id="players-container" class="players-grid"></div>
            </div>

            <div>
                <div class="card">
                    <h2 id="title-reengage">🔄 Reenganchar Eliminado</h2>
                    <div class="form-group">
                        <div class="input-group">
                            <select id="select-eliminated-player">
                                <option value="" id="opt-select-default">-- Seleccionar --</option>
                            </select>
                            <button type="button" id="btn-reengage">Entrar</button>
                        </div>
                    </div>
                    <p style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;" id="txt-reengage-info">
                        ℹ️ Hereda la puntuación máxima activa.
                    </p>
                </div>

                <div class="card">
                    <h2 id="title-new-player">➕ Nuevo Jugador</h2>
                    <div class="form-group">
                        <div class="input-group">
                            <input type="text" id="reeng-name" placeholder="Nombre">
                            <button type="button" id="btn-add-new-midgame">Añadir</button>
                        </div>
                    </div>
                </div>

                <div class="action-buttons-group">
                    <button type="button" id="btn-clean-eliminated" class="warning full-width">🧹 Limpiar</button>
                    <button type="button" id="btn-reset" class="danger full-width">🔄 Reiniciar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const i18n = {
        es: {
            appTitle: "Conteo de Cartas",
            setupTitle: "⚙️ Configuración de la Partida",
            lblLimit: "Límite de Puntos",
            lblMaxReentries: "Máx. Reenganches",
            unlimitedHelper: "0 = Ilimitados",
            lblAddPlayers: "Añadir Jugadores",
            inputNamePlaceholder: "Nombre del jugador",
            btnAdd: "+ Añadir",
            btnStart: "🚀 ¡Iniciar Partida!",
            errInvalidName: "Escribe un nombre válido",
            errNoPlayers: "Añade al menos un jugador antes de iniciar.",
            titleReengage: "🔄 Reenganchar Eliminado",
            optSelectDefault: "-- Seleccionar --",
            btnEnter: "Entrar",
            txtReengageInfo: "ℹ️ Hereda la puntuación máxima activa.",
            titleNewPlayer: "➕ Nuevo Jugador",
            btnClean: "🧹 Limpiar",
            btnReset: "🔄 Reiniciar",
            limitBanner: "🎯 Límite: {limit} pts | 🔄 Reenganches máx: {reentries}",
            noLimitBanner: "🎲 Sin límite | 🔄 Reenganches máx: {reentries}",
            unlimited: "Ilimitados",
            leaderBadge: "👑 Líder",
            elimBadge: "Eliminado",
            pts: "pts",
            btnSum: "+ Sumar",
            reentryCount: "🔄 {count} reenganche(s)",
            reentryExceeded: "❌ Sin reenganches disponibles"
        },
        en: {
            appTitle: "Card Scorekeeper",
            setupTitle: "⚙️ Game Setup",
            lblLimit: "Point Limit",
            lblMaxReentries: "Max Re-entries",
            unlimitedHelper: "0 = Unlimited",
            lblAddPlayers: "Add Players",
            inputNamePlaceholder: "Player name",
            btnAdd: "+ Add",
            btnStart: "🚀 Start Game!",
            errInvalidName: "Enter a valid name",
            errNoPlayers: "Add at least one player before starting.",
            titleReengage: "🔄 Re-enter Eliminated",
            optSelectDefault: "-- Select --",
            btnEnter: "Re-enter",
            txtReengageInfo: "ℹ️ Inherits the highest active score.",
            titleNewPlayer: "➕ New Player",
            btnClean: "🧹 Clear",
            btnReset: "🔄 Reset",
            limitBanner: "🎯 Limit: {limit} pts | 🔄 Max Re-entries: {reentries}",
            noLimitBanner: "🎲 No limit | 🔄 Max Re-entries: {reentries}",
            unlimited: "Unlimited",
            leaderBadge: "👑 Leader",
            elimBadge: "Eliminated",
            pts: "pts",
            btnSum: "+ Add",
            reentryCount: "🔄 {count} re-entry(s)",
            reentryExceeded: "❌ No re-entries left"
        },
        fr: {
            appTitle: "Compteur de Cartes",
            setupTitle: "⚙️ Configuration de la Partie",
            lblLimit: "Limite de Points",
            lblMaxReentries: "Max Réintégrations",
            unlimitedHelper: "0 = Illimitées",
            lblAddPlayers: "Ajouter des Joueurs",
            inputNamePlaceholder: "Nom du joueur",
            btnAdd: "+ Ajouter",
            btnStart: "🚀 Démarrer la Partie !",
            errInvalidName: "Entrez un nom valide",
            errNoPlayers: "Ajoutez au moins un joueur avant de commencer.",
            titleReengage: "🔄 Réintégrer un Éliminé",
            optSelectDefault: "-- Sélectionner --",
            btnEnter: "Entrer",
            txtReengageInfo: "ℹ️ Hérite du score actif le plus élevé.",
            titleNewPlayer: "➕ Nouveau Joueur",
            btnClean: "🧹 Nettoyer",
            btnReset: "🔄 Réinitialiser",
            limitBanner: "🎯 Limite : {limit} pts | 🔄 Réintégrations max : {reentries}",
            noLimitBanner: "🎲 Sans limite | 🔄 Réintégrations max : {reentries}",
            unlimited: "Illimitées",
            leaderBadge: "👑 Leader",
            elimBadge: "Éliminé",
            pts: "pts",
            btnSum: "+ Ajouter",
            reentryCount: "🔄 {count} réintégration(s)",
            reentryExceeded: "❌ Plus de réintégrations"
        }
    };

    let currentLang = 'es';
    let limit = 0;
    let maxReentries = 0;
    let players = [];

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('app_lang');
        const browserLang = navigator.language ? navigator.language.split('-')[0] : 'es';
        currentLang = savedLang || (i18n[browserLang] ? browserLang : 'es');
        
        const langSwitch = document.getElementById('lang-switch');
        langSwitch.value = currentLang;
        langSwitch.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('app_lang', currentLang);
            applyLanguage();
            renderBoard();
        });

        applyLanguage();

        document.getElementById('btn-add-initial').addEventListener('click', addInitialPlayer);
        document.getElementById('player-name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addInitialPlayer(); });
        document.getElementById('btn-start-game').addEventListener('click', startGame);
        document.getElementById('btn-reset').addEventListener('click', resetGame);
        document.getElementById('btn-clean-eliminated').addEventListener('click', cleanEliminatedPlayers);
        document.getElementById('btn-reengage').addEventListener('click', reengageSelectedPlayer);
        document.getElementById('btn-add-new-midgame').addEventListener('click', addNewPlayerMidgame);
        document.getElementById('reeng-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') addNewPlayerMidgame(); });
    });

    function applyLanguage() {
        const t = i18n[currentLang];
        document.getElementById('app-title').innerText = t.appTitle;
        document.getElementById('setup-title').innerText = t.setupTitle;
        document.getElementById('lbl-limit').innerText = t.lblLimit;
        document.getElementById('lbl-max-reentries').innerText = t.lblMaxReentries;
        document.getElementById('max-reentries-input').placeholder = t.unlimitedHelper;
        document.getElementById('lbl-add-players').innerText = t.lblAddPlayers;
        document.getElementById('player-name-input').placeholder = t.inputNamePlaceholder;
        document.getElementById('btn-add-initial').innerText = t.btnAdd;
        document.getElementById('btn-start-game').innerText = t.btnStart;
        document.getElementById('title-reengage').innerText = t.titleReengage;
        document.getElementById('opt-select-default').innerText = t.optSelectDefault;
        document.getElementById('btn-reengage').innerText = t.btnEnter;
        document.getElementById('txt-reengage-info').innerText = t.txtReengageInfo;
        document.getElementById('title-new-player').innerText = t.titleNewPlayer;
        document.getElementById('reeng-name').placeholder = t.inputNamePlaceholder;
        document.getElementById('btn-add-new-midgame').innerText = t.btnAdd;
        document.getElementById('btn-clean-eliminated').innerText = t.btnClean;
        document.getElementById('btn-reset').innerText = t.btnReset;

        if (!document.getElementById('game-screen').classList.contains('hidden')) {
            updateBanner();
        }
    }

    function updateBanner() {
        const t = i18n[currentLang];
        const reentriesTxt = maxReentries > 0 ? maxReentries : t.unlimited;
        const bannerTemplate = limit > 0 ? t.limitBanner : t.noLimitBanner;
        document.getElementById('limit-display').innerText = bannerTemplate
            .replace('{limit}', limit)
            .replace('{reentries}', reentriesTxt);
    }

    function addInitialPlayer() {
        const input = document.getElementById('player-name-input');
        const msg = document.getElementById('setup-msg');
        const name = input.value.trim();
        
        if (name !== "") {
            players.push({ name: name, score: 0, reentries: 0 });
            input.value = '';
            msg.className = 'msg-box';
            msg.innerText = '';
            renderInitialList();
            input.focus();
        } else {
            msg.innerText = i18n[currentLang].errInvalidName;
            msg.className = 'msg-box error';
        }
    }

    function removeInitialPlayer(index) {
        players.splice(index, 1);
        renderInitialList();
    }

    function renderInitialList() {
        const list = document.getElementById('initial-players-list');
        list.innerHTML = players.map((p, i) => `
            <li>
                <span>👤 ${p.name}</span>
                <button type="button" class="danger" style="padding: 3px 7px; font-size: 0.75rem;" onclick="removeInitialPlayer(${i})">✕</button>
            </li>
        `).join('');
    }

    function startGame() {
        const msg = document.getElementById('setup-msg');
        limit = parseInt(document.getElementById('limit-input').value) || 0;
        maxReentries = parseInt(document.getElementById('max-reentries-input').value) || 0;
        
        if (players.length === 0) {
            msg.innerText = i18n[currentLang].errNoPlayers;
            msg.className = 'msg-box error';
            return;
        }
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateBanner();
        renderBoard();
    }

    function addPoints(index) {
        const input = document.getElementById(`add-input-${index}`);
        const points = parseInt(input.value);
        if (!isNaN(points)) {
            players[index].score += points;
            input.value = '';
            renderBoard();
        }
    }

    function getHighestActiveScore() {
        if (limit <= 0) {
            return players.length > 0 ? Math.max(...players.map(p => p.score)) : 0;
        }
        const activePlayers = players.filter(p => p.score < limit);
        if (activePlayers.length > 0) {
            return Math.max(...activePlayers.map(p => p.score));
        }
        return 0;
    }

    function reengageSelectedPlayer() {
        const select = document.getElementById('select-eliminated-player');
        const playerIndex = select.value;
        if (playerIndex === "") return;

        const p = players[playerIndex];
        
        if (maxReentries > 0 && p.reentries >= maxReentries) {
            alert(i18n[currentLang].reentryExceeded);
            return;
        }

        const targetScore = getHighestActiveScore();
        p.score = targetScore;
        p.reentries += 1;
        renderBoard();
    }

    function addNewPlayerMidgame() {
        const nameInput = document.getElementById('reeng-name');
        const name = nameInput.value.trim();
        if (!name) return;

        const targetScore = getHighestActiveScore();
        players.push({ name: name, score: targetScore, reentries: 0 });
        nameInput.value = '';
        renderBoard();
    }

    function deletePlayer(index) {
        players.splice(index, 1);
        renderBoard();
    }

    function cleanEliminatedPlayers() {
        if (limit <= 0) return;
        players = players.filter(p => p.score < limit);
        renderBoard();
    }

    function renderBoard() {
        const container = document.getElementById('players-container');
        const selectEliminated = document.getElementById('select-eliminated-player');
        const t = i18n[currentLang];

        const activePlayers = players.filter(p => limit <= 0 || p.score < limit);
        const minActiveScore = activePlayers.length > 0 ? Math.min(...activePlayers.map(p => p.score)) : null;

        container.innerHTML = players.map((p, i) => {
            const isEliminated = limit > 0 && p.score >= limit;
            const isLeader = !isEliminated && minActiveScore !== null && p.score === minActiveScore && activePlayers.length > 1;
            const initialLetter = p.name.charAt(0).toUpperCase();

            let reentryBadge = '';
            if (p.reentries > 0) {
                const limitTxt = maxReentries > 0 ? `/${maxReentries}` : '';
                reentryBadge = `<span class="reentry-pill">🔄 ${p.reentries}${limitTxt}</span>`;
            }

            return `
                <div class="player-card ${isEliminated ? 'eliminated' : ''} ${isLeader ? 'leader' : ''}">
                    <div class="badge-container">
                        ${isLeader ? `<span class="leader-badge">${t.leaderBadge}</span>` : ''}
                        ${isEliminated ? `<span class="elim-badge">${t.elimBadge}</span>` : ''}
                    </div>

                    <div class="player-header-row">
                        <div class="player-identity">
                            <button class="delete-player-btn" title="✕" onclick="deletePlayer(${i})">✕</button>
                            <div class="player-avatar">${initialLetter}</div>
                            <div class="player-name-wrapper">
                                <div class="player-name">${p.name}</div>
                                ${reentryBadge}
                            </div>
                        </div>
                        <div class="player-score-badge">${p.score} <span style="font-size:0.75rem; font-weight:700;">${t.pts}</span></div>
                    </div>

                    <div class="player-actions-row">
                        <input type="number" id="add-input-${i}" class="score-input-large" placeholder="+/- pts" onkeydown="if(event.key==='Enter') addPoints(${i})">
                        <button type="button" class="btn-add-pts" onclick="addPoints(${i})">${t.btnSum}</button>
                    </div>
                </div>
            `;
        }).join('');

        selectEliminated.innerHTML = `<option value="">${t.optSelectDefault}</option>`;
        players.forEach((p, i) => {
            if (limit > 0 && p.score >= limit) {
                const canReenter = maxReentries === 0 || p.reentries < maxReentries;
                const statusTxt = canReenter 
                    ? `(${p.score} pts - Reeng: ${p.reentries}${maxReentries > 0 ? '/' + maxReentries : ''})` 
                    : `(${p.score} pts - AGOTADOS)`;
                
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${p.name} ${statusTxt}`;
                if (!canReenter) opt.disabled = true;
                selectEliminated.appendChild(opt);
            }
        });
    }

    function resetGame() {
        players = [];
        document.getElementById('initial-players-list').innerHTML = '';
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        document.getElementById('player-name-input').value = '';
        document.getElementById('setup-msg').className = 'msg-box';
        document.getElementById('setup-msg').innerText = '';
    }
</script>
</body>
</html>
